<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首頁 - 護理師</title>
<style>
  :root {
    --blue: #167eff;
    --blue-active: #2b92ff;
    --blue-nav: #509BF8;
    --text-primary: #1f2124;
    --text-secondary: #333333;
    --gray-done: #9aa0a9;
    --warning-orange: #ea7e07;
    --warning-bg: #fff6e8;
    --red-dot: #ff4b4b;
    --card-white: #ffffff;
    --progress-track: #e9eff6;
    --progress-fill: #167eff;
    --bg: #eff3f7;
    --gradient-top: #f3f8ff;
    --gradient-bottom: #edf5ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'HarmonyOS Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
    background: #e8ecf1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* ── Phone Frame ── */
  .phone-frame {
    width: 375px;
    max-width: 100vw;
    height: 812px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── Top Gradient Area (262px) ── */
  .top-area {
    flex-shrink: 0;
    background: linear-gradient(0deg, var(--gradient-top) 0%, var(--gradient-bottom) 100%);
    z-index: 2;
  }

  /* Status Bar - 36px */
  .status-bar {
    height: 36px;
    padding: 0 14.56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .status-bar .time {
    font-family: Roboto, sans-serif;
    font-size: 12.74px;
    line-height: 18.2px;
    letter-spacing: 0.0179em;
    color: #4D4447;
    width: 116.5px;
  }
  .status-icons {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  /* Header - 64px */
  .header {
    height: 64px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-title {
    flex: 1;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.5em;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .icon-btn {
    width: 44px;
    height: 40px;
    background: var(--card-white);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    position: relative;
    cursor: pointer;
    border: none;
    box-shadow: 0px 2px 6px 0px rgba(30, 119, 202, 0.06);
  }
  .icon-btn img {
    display: block;
  }
  .red-dot {
    position: absolute;
    top: -1px;
    right: -1px;
    width: 8px;
    height: 8px;
    background: var(--red-dot);
    border-radius: 50%;
  }

  /* 4-Grid Quick Entry - 98px */
  .quick-grid {
    height: 98px;
    padding: 0 16px;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
  }
  .grid-item {
    width: 80px;
    height: 98px;
    background: var(--card-white);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    border: none;
    box-shadow: 0px 2px 6px 0px rgba(30, 119, 202, 0.06);
  }
  .grid-item img {
    width: 40px;
    height: 40px;
  }
  .grid-item span {
    font-size: 14px;
    font-weight: 500;
    color: #444444;
    line-height: 1.3em;
  }

  /* Section Title - 48px */
  .section-title {
    height: 48px;
    padding: 16px 16px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-title .left {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 24px;
  }
  .section-title .right {
    font-size: 14px;
    font-weight: 500;
    color: var(--blue);
    line-height: 22px;
    cursor: pointer;
    border: none;
    background: none;
  }

  /* ── Scrollable Task List ── */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }
  .task-list {
    padding: 0 15px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 8px;
  }

  /* Card Shared */
  .card {
    background: var(--card-white);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0px 2px 5px 0px rgba(140, 157, 173, 0.1);
  }

  /* Completed task */
  .card-completed {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-completed .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-done);
    line-height: 24px;
  }
  .card-completed .subtitle {
    font-size: 14px;
    font-weight: 400;
    color: var(--gray-done);
    line-height: 22px;
  }
  .card-completed .subtitle b {
    font-weight: 700;
  }

  /* Divider */
  .divider-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .divider-row .line {
    flex: 1;
    height: 0;
    border-top: 1px solid #888888;
  }
  .divider-row span {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* Active/In-progress card */
  .card-active {
    padding: 0;
    overflow: hidden;
  }
  .card-active .active-header {
    height: 44px;
    background: var(--blue-active);
    border-radius: 16px 16px 0 0;
    padding: 12px 16px 8px;
    display: flex;
    align-items: center;
  }
  .card-active .active-header .title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    line-height: 24px;
  }
  .card-active .active-info {
    padding: 8px 12px 12px;
    border-bottom: 1px solid #DDE5EF;
  }
  .card-active .active-info .info-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 24px;
  }
  .card-active .active-info .info-sub {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 22px;
    margin-top: 4px;
  }
  .card-active .progress-section {
    padding: 12px;
    border-radius: 0 0 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .progress-row {
    display: flex;
    align-items: flex-end;
    height: 28px;
  }
  .progress-row .station-icon {
    flex-shrink: 0;
  }
  .progress-track-zone {
    flex: 1;
    display: flex;
    align-items: center;
    position: relative;
    height: 24px;
    margin: 0 0px;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--progress-track);
    border-radius: 9px;
    position: relative;
    overflow: visible;
  }
  .progress-fill {
    width: 50%;
    height: 8px;
    background: var(--progress-fill);
    border-radius: 9px;
  }
  .progress-robot {
    position: absolute;
    top: 2px;
    left: calc(50% - 12px);
    z-index: 2;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 12px;
  }
  .progress-labels span {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.5em;
  }

  /* Warning card */
  .card-warning {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-warning .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 24px;
  }
  .card-warning .subtitle {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 22px;
  }
  .warning-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: var(--warning-bg);
    border-radius: 8px;
  }
  .warning-banner .warn-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--warning-orange);
    line-height: 22px;
  }

  /* Pending task card */
  .card-pending {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-pending .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-secondary);
    line-height: 24px;
  }
  .card-pending .subtitle {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 22px;
  }

  /* ── Bottom Area ── */
  .bottom-area {
    flex-shrink: 0;
    z-index: 2;
  }

  /* Bottom Nav - 66px */
  .bottom-nav {
    height: 66px;
    background: var(--card-white);
    border-top: 1px solid #E0E4EB;
    display: flex;
  }
  .nav-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px;
    cursor: pointer;
    border: none;
    background: none;
  }
  .nav-tab img {
    width: 32px;
    height: 32px;
    display: block;
  }
  .nav-tab span {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
  }
  .nav-tab.active span {
    color: var(--blue);
    font-weight: 500;
  }

  /* Home Indicator - 34px */
  .home-indicator {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-indicator .bar {
    width: 134px;
    height: 5px;
    background: #000000;
    border-radius: 3px;
  }

  /* ── Responsive ── */
  @media (max-width: 375px) {
    .phone-frame {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
  }
</style>
</head>
<body>

<div class="phone-frame">

  <!-- ▸ Top Gradient Area (262px) -->
  <div class="top-area">

    <!-- Status Bar 36px -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <!-- wifi -->
        <svg width="14.56" height="14.56" viewBox="0 0 15 15" fill="none">
          <path d="M7.28 2.18C10.21 2.18 12.87 3.84 14.12 6.11L12.8 7.43C11.78 5.54 9.7 4.2 7.28 4.2C4.86 4.2 2.78 5.54 1.76 7.43L0.44 6.11C1.69 3.84 4.35 2.18 7.28 2.18Z" fill="#1F2124"/>
          <path d="M7.28 6.55C8.92 6.55 10.41 7.46 11.1 8.77L9.78 10.09C9.31 9.03 8.29 8.3 7.28 8.3C6.27 8.3 5.25 9.03 4.78 10.09L3.46 8.77C4.15 7.46 5.64 6.55 7.28 6.55Z" fill="#1F2124"/>
          <path d="M7.28 10.92C7.87 10.92 8.37 11.42 8.37 12.01C8.37 12.6 7.87 13.1 7.28 13.1C6.69 13.1 6.19 12.6 6.19 12.01C6.19 11.42 6.69 10.92 7.28 10.92Z" fill="#1F2124"/>
        </svg>
        <!-- battery -->
        <svg width="14.56" height="14.56" viewBox="0 0 15 15" fill="none">
          <rect x="1" y="4" width="11" height="7.5" rx="1.5" stroke="#1F2124" stroke-width="1" fill="none"/>
          <rect x="12.5" y="6" width="1.5" height="3.5" rx="0.75" fill="#1F2124"/>
          <rect x="2.5" y="5.5" width="8" height="4.5" rx="0.5" fill="#1F2124"/>
        </svg>
      </div>
    </div>

    <!-- Header 64px -->
    <div class="header">
      <span class="header-title">👋 Hi 護理師名稱</span>
      <div class="header-actions">
        <!-- scan -->
        <button class="icon-btn">
          <img src="icons/icon-24px-scan.svg" alt="掃碼" width="24" height="24">
        </button>
        <!-- message + red dot -->
        <button class="icon-btn">
          <img src="icons/icon-24px-message.svg" alt="消息" width="24" height="24">
          <span class="red-dot"></span>
        </button>
      </div>
    </div>

    <!-- 4-Grid Quick Entry 98px -->
    <div class="quick-grid">
      <div class="grid-item">
        <img src="icons/icon-grid-medicine.svg" alt="藥品配送">
        <span>藥品配送</span>
      </div>
      <div class="grid-item">
        <img src="icons/icon-grid-specimen.svg" alt="檢體取送">
        <span>檢體取送</span>
      </div>
      <div class="grid-item">
        <img src="icons/icon-grid-health-edu.svg" alt="護理衛教">
        <span>護理衛教</span>
      </div>
      <div class="grid-item">
        <img src="icons/icon-grid-environment.svg" alt="環境介紹">
        <span>環境介紹</span>
      </div>
    </div>

    <!-- Section Title 48px -->
    <div class="section-title">
      <span class="left">最近的派工</span>
      <button class="right">查看全部</button>
    </div>
  </div><!-- /top-area -->

  <!-- ▸ Scrollable Task List -->
  <div class="scroll-area">
    <div class="task-list">

      <!-- 1. Completed -->
      <div class="card card-completed">
        <span class="title">藥品配送</span>
        <span class="subtitle">於 <b>10:20</b> 結束</span>
      </div>

      <!-- Divider -->
      <div class="divider-row">
        <span class="line"></span>
        <span>以上是最近10分鐘內結束的派工</span>
        <span class="line"></span>
      </div>

      <!-- 2. Active / In-Progress -->
      <div class="card card-active">
        <div class="active-header">
          <span class="title">藥品配送</span>
        </div>
        <div class="active-info">
          <div class="info-title">正在領取藥品</div>
          <div class="info-sub">護理師正在領取藥品</div>
        </div>
        <div class="progress-section">
          <div class="progress-row">
            <img class="station-icon" src="icons/icon-24px-nursing-station.svg" alt="護理站" width="24" height="24">
            <div class="progress-track-zone">
              <div class="progress-track">
                <div class="progress-fill"></div>
              </div>
              <img class="progress-robot" src="icons/icon-24px-robot.svg" alt="機器人" width="24" height="24">
            </div>
            <img class="station-icon" src="icons/icon-24px-nursing-station.svg" alt="護理站" width="24" height="24">
          </div>
          <div class="progress-labels">
            <span>護理站</span>
            <span>A-2</span>
            <span>護理站</span>
          </div>
        </div>
      </div>

      <!-- 3. Warning Card -->
      <div class="card card-warning">
        <div class="title">檢體取送</div>
        <div class="subtitle">預約執行時間：10:20~10:25 (5min)</div>
        <div class="warning-banner">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="9" stroke="#ee913e" stroke-width="1.5"/>
            <path d="M10 6v5M10 13.5v.5" stroke="#ee913e" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="warn-text">派工異動，延後執行時間</span>
        </div>
      </div>

      <!-- 4. Normal Pending -->
      <div class="card card-pending">
        <div class="title">藥品配送</div>
        <div class="subtitle">預約執行時間：10:20~10:25 (5min)</div>
      </div>

      <!-- 5. Normal Pending -->
      <div class="card card-pending">
        <div class="title">藥品配送</div>
        <div class="subtitle">預約執行時間：10:20~10:25 (5min)</div>
      </div>

    </div>
  </div><!-- /scroll-area -->

  <!-- ▸ Bottom Fixed Area -->
  <div class="bottom-area">
    <!-- Navigation Bar 66px -->
    <div class="bottom-nav">
      <div class="nav-tab active">
        <img src="icons/icon-32px-home-selected.svg" alt="首頁" width="32" height="32">
        <span>首頁</span>
      </div>
      <div class="nav-tab">
        <img src="icons/icon-32px-mission-default.svg" alt="派工列表" width="32" height="32">
        <span>派工列表</span>
      </div>
      <div class="nav-tab">
        <img src="icons/icon-32px-mine-default.svg" alt="我的" width="32" height="32">
        <span>我的</span>
      </div>
    </div>
    <!-- Home Indicator 34px -->
    <div class="home-indicator">
      <div class="bar"></div>
    </div>
  </div>

</div><!-- /phone-frame -->

</body>
</html>
